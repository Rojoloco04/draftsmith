{{/* PROTOTYPE: floating variant switcher for the overview redesigns.
     Takes dict "Variant" "Queue". Delete with prototype_overview.go. */}}
{{define "protoSwitch"}}
<link rel="stylesheet" href="{{asset "prototype.css"}}">
<script src="{{asset "prototype.js"}}" defer></script>
<nav class="proto-switch" aria-label="Prototype variants" data-variant="{{.Variant}}" data-queue="{{.Queue}}">
  <button type="button" data-step="-1" aria-label="Previous variant">‹</button>
  <span class="proto-label"></span>
  <button type="button" data-step="1" aria-label="Next variant">›</button>
</nav>
{{end}}
